name: ellimate
description: "ElliMate - Live together. Communicate better. Apartment management and roommate communication app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.1

  # Backend
  supabase_flutter: ^2.8.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Preferences
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^6.1.1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
